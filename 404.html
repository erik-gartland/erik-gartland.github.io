<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Erik Gartland</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Figtree:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --cream: #f7f3ed; --cream-2: #ede8df; --cream-3: #e2ddd5;
  --charcoal: #2a2f2e; --charcoal-mid: #4a5250; --charcoal-light: #8a9896;
  --white: #ffffff;
  --seafoam: #4caf8a; --seafoam-300: #70c9a8; --seafoam-500: #2d9e72;
  --seafoam-600: #1e845d; --seafoam-l: #a4dfc8; --seafoam-xl: #d0f0e3;
  --f-display: 'Lora', serif; --f-body: 'Figtree', sans-serif; --f-mono: 'Fira Code', monospace;
}
body { font-family: var(--f-body); background: var(--cream); color: var(--charcoal); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
nav {
  position: sticky; top: 0; z-index: 100; background: var(--white);
  border-bottom: 1px solid var(--cream-3); padding: 0 48px;
  display: flex; align-items: center; justify-content: space-between; height: 56px;
}
.nav-name { font-family: var(--f-mono); font-size: 17px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--charcoal); text-decoration: none; }
.nav-links { display: flex; gap: 32px; list-style: none; }
.nav-links a { font-family: var(--f-body); font-size: 13px; font-weight: 500; color: var(--charcoal-light); text-decoration: none; transition: color 0.15s; }
.nav-links a:hover { color: var(--seafoam-500); }
.content { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px; }
.inner { max-width: 480px; text-align: center; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--seafoam); margin-bottom: 16px; }
.heading { font-family: var(--f-display); font-size: 36px; font-weight: 700; color: var(--charcoal); margin-bottom: 16px; }
.subtext { font-family: var(--f-body); font-size: 16px; color: var(--charcoal-mid); line-height: 1.7; margin-bottom: 32px; }
.btn { font-family: var(--f-body); font-size: 13px; font-weight: 600; padding: 10px 20px; border-radius: 4px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; background: var(--seafoam-xl); color: var(--seafoam-600); border: 1px solid var(--seafoam-l); transition: all 0.15s; }
.btn:hover { background: var(--seafoam-l); }
footer { background: var(--white); border-top: 1px solid var(--cream-3); padding: 32px 48px; display: flex; justify-content: space-between; align-items: center; }
.footer-name { font-family: var(--f-mono); font-size: 10px; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; color: var(--charcoal-light); }
@media (max-width: 680px) {
  nav { padding: 0 24px; }
  .content { padding: 32px 24px; }
  footer { flex-direction: column; gap: 8px; padding: 24px; }
}
</style>
<script>
  // Redirect known old URLs to their correct new locations
  const redirects = {
    '/research.html': '/research/',
    '/about.html':    '/about/',
    '/cv.html':       '/cv/',
    '/media.html':    '/media/',
    '/index.html':    '/'
  };
  const path = window.location.pathname;
  if (redirects[path]) {
    window.location.replace(redirects[path]);
  }
</script>
</head>
<body>

<nav>
  <a class="nav-name" href="/">Erik Gartland</a>
  <ul class="nav-links">
    <li><a href="/about/">About</a></li>
    <li><a href="/research/">Research</a></li>
    <li><a href="/media/">Media</a></li>
    <li><a href="/cv/">CV</a></li>
    <li><a href="/#contact">Contact</a></li>
  </ul>
</nav>

<div class="content">
  <div class="inner">
    <p class="eyebrow">404</p>
    <h1 class="heading">Page Not Found</h1>
    <p class="subtext">The page you're looking for doesn't exist or may have moved. Try one of the links above, or head back home.</p>
    <a href="/" class="btn">← Back to Home</a>
  </div>
</div>

<footer>
  <span class="footer-name">Erik Gartland · Housing Policy Researcher</span>
  <span class="footer-name">Updated July 2026</span>
</footer>

</body>
</html>
